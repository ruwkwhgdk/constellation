<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Constellation 전투 제작실</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><span class="eyebrow">PROJECT CONSTELLATION</span><h1>전투 제작실</h1></div><span id="status" role="status">연결 중</span></header>
<div class="layout"><aside><label>저장된 전투 버전<select id="versions"></select></label><div class="pair"><button id="load">열기</button><button id="clone">복제하여 시작</button></div><nav id="nav"></nav><p class="note">플레이에서는 F1로 수치를 조정합니다.<br>제작실에서는 새 버전을 저장하고 맵으로 만듭니다.</p></aside>
<main><div class="toolbar"><label>새 버전 이름<input id="versionName" placeholder="예: SlimeGuard_v1"></label><button id="undo">되돌리기</button><button id="redo">다시 실행</button></div><div class="section-title"><div><h2 id="title"></h2><p id="subtitle"></p></div><input id="search" placeholder="현재 항목 검색" aria-label="현재 항목 검색"></div><div id="content"></div><div id="message" role="alert"></div>
<footer><button id="validate">① 입력 검사</button><button id="save">② 새 버전 저장</button><button id="preview">③ 엔진 검증</button><button id="build" class="primary">④ 맵 제작</button><button id="play">⑤ 플레이</button><button id="logs">진단 로그</button></footer><p class="note">기존 파일과 자산은 덮어쓰지 않습니다. 수정본은 새 이름으로 저장하세요. 엔진 검증·제작은 잠시 시간이 걸립니다.</p></main></div>
<dialog id="logDialog"><h2>작업 진단</h2><pre id="logText"></pre><button id="exportDiagnostic">초안·변경·로그 내려받기</button><button onclick="this.closest('dialog').close()">닫기</button></dialog><script>window.COMBAT_TOKEN="__TOKEN__";</script><script src="/app.js"></script></body></html>
